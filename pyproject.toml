[project]
name = "testing-examples"
version = "0.2.0"
description = "Übung Unit-Tests: Äquivalenzklassen und Grenzwertanalyse mit pytest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.406",
    "pytest>=9.2.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 120
# Markdown nicht anfassen: Sonst formatiert ruff die Codebeispiele im README und zählt die Datei mit.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "C4", "UP"]

[tool.ruff.format]
line-ending = "lf"
preview = true
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# Strikte Type-Prüfung für den Code unter src/
typeCheckingMode = "strict"
include = ["src"]
# Testcode braucht keine vollständigen Type Hints. ignore hält tests/ auch im Editor frei von Meldungen.
ignore = ["tests"]

# Reporting-Optionen
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
